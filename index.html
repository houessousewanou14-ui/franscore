
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>FRANSCORE - Scores sportifs en direct</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f9;color:#172033;font-family:Arial,sans-serif}
header{background:#101827;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;color:#35d18a}
.live{background:#173f32;color:#48e5a2;padding:8px 13px;border-radius:20px}
main{max-width:1000px;margin:25px auto;padding:0 15px}
h1{font-size:25px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin:20px 0}
.tabs button{border:0;background:white;padding:12px 18px;border-radius:10px;white-space:nowrap;cursor:pointer}
.tabs button.active{background:#14243b;color:white}
.section{background:white;padding:18px;border-radius:14px;margin:15px 0}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:18px 5px;border-bottom:1px solid #eee}
.team{font-weight:bold}
.score{font-size:25px;font-weight:900}
.status{font-size:12px;color:#16a36a;margin-top:5px}
.league{font-size:12px;color:#718096;font-weight:bold}
footer{text-align:center;padding:30px;color:#718096}
</style>
</head>
<body>
<header>
  <div class="logo">🏆 FRANSCORE</div>
  <div class="live">● SPORTS LIVE</div>
</header>
<main>
  <h1>Tous les scores sportifs</h1>
  <p>Suivez vos compétitions et vos équipes préférées.</p>

  <div class="tabs">
    <button class="active" onclick="showSport('Football',this)">⚽ Football</button>
    <button onclick="showSport('Basketball',this)">🏀 Basketball</button>
    <button onclick="showSport('Tennis',this)">🎾 Tennis</button>
    <button onclick="showSport('Volleyball',this)">🏐 Volleyball</button>
  </div>

  <div class="section">
    <h3 id="sportTitle">⚽ Football - Matchs</h3>
    <div id="matches"></div>
  </div>
</main>
<footer>FRANSCORE © 2026 - Tous les sports, tous les scores.</footer>

<script>
const sports={
 Football:[
  ["Ligue 1","PSG","Marseille","2 - 1","67e"],
  ["Premier League","Arsenal","Chelsea","1 - 0","52e"],
  ["Liga","Real Madrid","Barcelone","0 - 0","À venir"]
 ],
 Basketball:[
  ["NBA","Lakers","Celtics","98 - 92","4e quart-temps"]
 ],
 Tennis:[
  ["ATP","Joueur A","Joueur B","1 - 0","2e set"]
 ],
 Volleyball:[
  ["Championnat","Équipe A","Équipe B","2 - 1","4e set"]
 ]
};

function showSport(sport,button){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 button.classList.add('active');
 document.getElementById('sportTitle').textContent=sport+" - Matchs";
 document.getElementById('matches').innerHTML=sports[sport].map(m=>`
 <div class="match">
  <div><div class="league">${m[0]}</div><div class="team">${m[1]}</div></div>
  <div><div class="score">${m[3]}</div><div class="status">● ${m[4]}</div></div>
  <div class="team">${m[2]}</div>
 </div>`).join('');
}
showSport('Football',document.querySelector('.tabs button'));
</script>
</body>
</html>
